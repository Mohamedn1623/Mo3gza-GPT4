<html>
  <body style="font-family: Arial, sans-serif; direction: rtl; background:#f8fafc; margin:0; padding:0;">
    <div style="max-width:680px; margin:24px auto; background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 35px rgba(15,23,42,0.08);">
      <header style="padding:24px; background:linear-gradient(135deg,#0f172a,#2563eb); color:#fff;">
        <h2 style="margin:0; font-size:22px;">رسالة جديدة للطلب {{REQUEST_ID}}</h2>
      </header>
      <main style="padding:24px; color:#0f172a;">
        <p><strong>الاسم:</strong> {{CUSTOMER}}</p>
        <p><strong>رقم الطلب:</strong> {{REQUEST_ID}}</p>
        <p><strong>التاريخ:</strong> {{DATE}}</p>
        <h3 style="margin-top:20px;">الرسالة</h3>
        <p style="line-height:1.8;">{{MESSAGE}}</p>
        <p><a href="{{APP_URL}}" style="color:#2563eb;">فتح الموقع</a></p>
      </main>
    </div>
  </body>
</html>
